name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          bash -n install.sh
          bash -n bin/sbx
          bash -n lib/sbx_v3.sh
          bash -n lib/sbx_proxy.sh
          bash -n lib/sbx_bootstrap.sh
          bash -n lib/sbx_image.sh
          bash -n lib/sbx_inbound.sh
          bash -n lib/sbx_docker_network.sh
          bash -n bin/sbx-docker-watch
          bash -n lib/sbx_update.sh
          bash -n bin/sbx-install

      - name: ShellCheck (errors gate)
        run: |
          shellcheck --version
          shellcheck -S error \
            install.sh bin/sbx bin/sbx-install bin/sbx-docker-watch \
            lib/sbx_bootstrap.sh lib/sbx_docker_network.sh lib/sbx_image.sh \
            lib/sbx_inbound.sh lib/sbx_proxy.sh lib/sbx_update.sh lib/sbx_v3.sh

      - name: ShellCheck (warnings, advisory)
        continue-on-error: true
        run: |
          shellcheck -S warning \
            install.sh bin/sbx bin/sbx-install bin/sbx-docker-watch \
            lib/sbx_bootstrap.sh lib/sbx_docker_network.sh lib/sbx_image.sh \
            lib/sbx_inbound.sh lib/sbx_proxy.sh lib/sbx_update.sh lib/sbx_v3.sh

      - name: Python syntax
        run: |
          python -m py_compile lib/sbx_nodes.py
          python -m py_compile lib/sbx_docker_targets.py
          python -m py_compile lib/sbx_verify.py

      - name: Verify installer prefers raw source
        run: |
          grep -F 'SBX_SOURCE_BASE_URL' install.sh
          grep -F 'raw.githubusercontent.com' install.sh
          grep -F 'raw 源不可用，回退 GitHub archive' install.sh
          grep -F 'lib/sbx_inbound.sh' install.sh
          grep -F 'lib/sbx_docker_network.sh' install.sh
          grep -F 'lib/sbx_docker_targets.py' install.sh
          grep -F 'lib/sbx_verify.py' install.sh
          grep -F 'bin/sbx-docker-watch' install.sh
          grep -F 'lib/sbx_update.sh' install.sh
          grep -F 'bin/sbx-install' install.sh
          grep -F 'VERSION' install.sh
          awk '/get_source\(\)/,/read_env_value\(\)/' install.sh | grep -F 'SOURCE_BASE_URL'
          awk '/get_source\(\)/,/read_env_value\(\)/' install.sh | grep -F 'ARCHIVE_URL'

      - name: Exercise manager-only update mode
        run: |
          EXPECTED_MANAGER_VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$EXPECTED_MANAGER_VERSION"
          rm -rf /tmp/sbx-manager-only /tmp/sbx-ci-bin
          mkdir -p /tmp/sbx-manager-only/nodes /tmp/sbx-manager-only/config /tmp/sbx-ci-bin
          cat > /tmp/sbx-manager-only/.env <<'EOF'
          SING_BOX_IMAGE=ghcr.io/sagernet/sing-box
          SING_BOX_VERSION=v1.14.2
          SING_BOX_CONTAINER_NAME=sing-box
          SING_BOX_BIND_ADDR=127.0.0.1
          SING_BOX_MIXED_PORT=7890
          EOF
          cat > /tmp/sbx-manager-only/nodes/nodes.json <<'EOF'
          {"sentinel":"nodes-unchanged"}
          EOF
          cat > /tmp/sbx-manager-only/config/config.json <<'EOF'
          {"sentinel":"config-unchanged"}
          EOF
          sha256sum /tmp/sbx-manager-only/.env /tmp/sbx-manager-only/nodes/nodes.json /tmp/sbx-manager-only/config/config.json > /tmp/before.sha
          sudo env \
            SBX_MANAGER_ONLY=1 \
            SBX_NONINTERACTIVE=1 \
            SBX_INSTALL_DIR=/tmp/sbx-manager-only \
            SBX_BIN_LINK=/tmp/sbx-ci-bin/sbx \
            SBX_INSTALLER_LINK=/tmp/sbx-ci-bin/sbx-install \
            bash install.sh
          sha256sum -c /tmp/before.sha
          test "$(tr -d '[:space:]' < /tmp/sbx-manager-only/VERSION)" = "$EXPECTED_MANAGER_VERSION"
          test -x /tmp/sbx-ci-bin/sbx-install
          test -x /tmp/sbx-manager-only/lib/sbx_update.sh
          test -x /tmp/sbx-manager-only/lib/sbx_docker_targets.py
          test -x /tmp/sbx-manager-only/lib/sbx_verify.py
          test -x /tmp/sbx-manager-only/bin/sbx-docker-watch

      - name: Exercise installed CLI
        run: |
          test -x /tmp/sbx-ci-bin/sbx
          sudo env SBX_HOME=/tmp/sbx-manager-only /tmp/sbx-ci-bin/sbx help >/dev/null
          sudo env SBX_HOME=/tmp/sbx-manager-only /tmp/sbx-ci-bin/sbx image ref
          sudo env SBX_HOME=/tmp/sbx-manager-only /tmp/sbx-ci-bin/sbx proxy status
          sudo env SBX_HOME=/tmp/sbx-manager-only /tmp/sbx-ci-bin/sbx manager auto status
          # 上面的 HOME 里 nodes.json 是“不得改动”的哨兵文件，换成合法空库后再跑涉及节点库的命令
          sudo rm -f /tmp/sbx-manager-only/nodes/nodes.json
          sudo env SBX_HOME=/tmp/sbx-manager-only python3 /tmp/sbx-manager-only/lib/sbx_nodes.py init >/dev/null
          sudo env SBX_HOME=/tmp/sbx-manager-only /tmp/sbx-ci-bin/sbx node list
          sudo env SBX_HOME=/tmp/sbx-manager-only /tmp/sbx-ci-bin/sbx version
          # 安装不完整时必须给出可读报错，而不是 "main: command not found"
          rm -rf /tmp/sbx-broken && mkdir -p /tmp/sbx-broken
          if sudo env SBX_HOME=/tmp/sbx-broken /tmp/sbx-ci-bin/sbx status 2>/tmp/sbx-broken.err; then
            echo "缺 lib 时不应成功" >&2
            exit 1
          fi
          grep -F '安装不完整' /tmp/sbx-broken.err

      - name: Exercise auto-update timer generation
        run: |
          export HOME_DIR="${{ github.workspace }}/.ci-update-home"
          export SBX_UPDATE_NO_APPLY=1
          export SBX_UPDATE_SERVICE_FILE="${{ github.workspace }}/.ci-systemd/singbox-manager-update.service"
          export SBX_UPDATE_TIMER_FILE="${{ github.workspace }}/.ci-systemd/singbox-manager-update.timer"
          export SBX_BIN_LINK=/usr/local/bin/sbx
          mkdir -p "$HOME_DIR" "$(dirname "$SBX_UPDATE_SERVICE_FILE")"
          cp VERSION "$HOME_DIR/VERSION"
          info() { :; }
          warn() { :; }
          die() { printf 'ERROR: %s\n' "$*" >&2; return 1; }
          pause() { :; }
          source lib/sbx_update.sh
          manager_auto_on
          grep -F 'ExecStart=/usr/local/bin/sbx manager update --quiet' "$SBX_UPDATE_SERVICE_FILE"
          grep -F 'Environment="SBX_UPDATE_BASE_URL=' "$SBX_UPDATE_SERVICE_FILE"
          grep -F 'OnUnitActiveSec=24h' "$SBX_UPDATE_TIMER_FILE"
          grep -F 'RandomizedDelaySec=30min' "$SBX_UPDATE_TIMER_FILE"
          manager_auto_status | grep -F '自动更新: CONFIGURED'
          manager_auto_off
          test ! -e "$SBX_UPDATE_SERVICE_FILE"
          test ! -e "$SBX_UPDATE_TIMER_FILE"

      - name: Exercise sbx-install proxy fallback
        run: |
          rm -rf /tmp/sbx-fake-bin /tmp/sbx-launcher-test
          mkdir -p /tmp/sbx-fake-bin /tmp/sbx-launcher-test
          cat > /tmp/sbx-fake-bin/curl <<'EOF'
          #!/usr/bin/env bash
          set -eu
          out=""
          proxy=0
          while [ "$#" -gt 0 ]; do
            case "$1" in
              --proxy) proxy=1; shift 2 ;;
              -o) out="$2"; shift 2 ;;
              *) shift ;;
            esac
          done
          if [ "$proxy" -eq 0 ]; then
            exit 28
          fi
          printf '#!/usr/bin/env bash\nexit 0\n' > "$out"
          EOF
          chmod +x /tmp/sbx-fake-bin/curl
          sudo env \
            PATH="/tmp/sbx-fake-bin:$PATH" \
            SBX_INSTALL_PROXY=http://127.0.0.1:7890 \
            bash bin/sbx-install

      - name: Validate example JSON
        run: python -m json.tool config/config.example.json >/dev/null

      - name: Validate Compose
        run: |
          cp .env.example .env
          mkdir -p data backup nodes
          cp config/config.example.json config/config.json
          docker compose -f compose.yml config >/dev/null

      - name: Verify runtime loads only config.json
        run: |
          grep -F '      - -c' compose.yml
          grep -F '      - /etc/sing-box/config.json' compose.yml
          if grep -F '      - -C' compose.yml; then
            echo "compose must not load the entire config directory" >&2
            exit 1
          fi

      - name: Generate managed config for all supported node types
        env:
          SBX_HOME: ${{ github.workspace }}/.ci-home
        run: |
          mkdir -p "$SBX_HOME/nodes" "$SBX_HOME/config"
          cat > "$SBX_HOME/nodes/nodes.json" <<'JSON'
          {
            "version": 1,
            "default": "11111111",
            "nodes": [
              {
                "id": "11111111",
                "name": "ss-test",
                "type": "shadowsocks",
                "server": "127.0.0.1",
                "server_port": 8388,
                "method": "aes-256-gcm",
                "password": "test-password"
              },
              {
                "id": "22222222",
                "name": "vless-test",
                "type": "vless",
                "server": "example.com",
                "server_port": 443,
                "uuid": "bf000d23-0752-40b4-affe-68f7707a9661",
                "tls": {
                  "enabled": true,
                  "server_name": "example.com",
                  "insecure": false
                }
              },
              {
                "id": "33333333",
                "name": "trojan-test",
                "type": "trojan",
                "server": "example.com",
                "server_port": 443,
                "password": "test-password",
                "tls": {
                  "enabled": true,
                  "server_name": "example.com",
                  "insecure": false
                }
              },
              {
                "id": "44444444",
                "name": "hy2-test",
                "type": "hysteria2",
                "server": "example.com",
                "server_port": 443,
                "password": "test-password",
                "tls": {
                  "enabled": true,
                  "server_name": "example.com",
                  "insecure": false
                }
              },
              {
                "id": "55555555",
                "name": "socks-test",
                "type": "socks",
                "server": "127.0.0.1",
                "server_port": 1080,
                "version": "5",
                "username": "user",
                "password": "pass"
              }
            ]
          }
          JSON
          python lib/sbx_nodes.py validate
          python lib/sbx_nodes.py render
          python -m json.tool "$SBX_HOME/config/config.json" >/dev/null

      - name: Exercise imports and automatic routing
        env:
          SBX_HOME: ${{ github.workspace }}/.ci-home
        run: |
          python lib/sbx_nodes.py import-uri 'ss://YWVzLTI1Ni1nY206cGFzcw==@example.com:8388#SS-import'
          printf '%s\n' 'trojan://secret@example.com:443?security=tls&sni=example.com#Trojan-import' > /tmp/sbx-sub.txt
          python lib/sbx_nodes.py import-file /tmp/sbx-sub.txt --source ci-subscription
          python lib/sbx_nodes.py strategy auto
          python lib/sbx_nodes.py route-mode cn-direct-full
          python lib/sbx_nodes.py validate
          python lib/sbx_nodes.py render
          python -m json.tool "$SBX_HOME/config/config.json" >/dev/null

      - name: Exercise multi-inbound routing
        env:
          SBX_HOME: ${{ github.workspace }}/.ci-home
        run: |
          python lib/sbx_nodes.py inbound-add \
            --name "HK-entry" \
            --listen 127.0.0.1 \
            --port 7891 \
            --target node:11111111

          python lib/sbx_nodes.py inbound-add \
            --name "Auto-entry" \
            --listen 127.0.0.1 \
            --port 7892 \
            --target auto

          python lib/sbx_nodes.py inbound-list
          python lib/sbx_nodes.py inbound-endpoints --json | python -c 'import json,sys; x=json.load(sys.stdin); assert x[0]["id"]=="default"; assert x[0]["port"]==7890; assert len(x)==3'
          python lib/sbx_nodes.py validate
          python lib/sbx_nodes.py render

          python - <<'PY'
          import json, os
          from pathlib import Path
          home = Path(os.environ["SBX_HOME"])
          cfg = json.loads((home / "config/config.json").read_text())
          custom = [x for x in cfg["inbounds"] if x["tag"].startswith("inbound-")]
          assert len(custom) == 2, custom
          rules = cfg["route"]["rules"]
          assert rules[0]["inbound"][0].startswith("inbound-")
          assert rules[0]["outbound"] == "node-11111111"
          assert rules[1]["outbound"] == "auto"
          ports = (home / "compose.inbounds.yml").read_text()
          assert "127.0.0.1:7891:7891/tcp" in ports
          assert "127.0.0.1:7892:7892/tcp" in ports
          PY

          docker compose \
            --env-file .env.example \
            -f compose.yml \
            -f "$SBX_HOME/compose.inbounds.yml" \
            config >/tmp/sbx-compose-merged.yml

          grep -F 'published: "7891"' /tmp/sbx-compose-merged.yml
          grep -F 'published: "7892"' /tmp/sbx-compose-merged.yml

      - name: Exercise bootstrap image configuration
        run: |
          cp .env.example /tmp/sbx-bootstrap.env
          info() { :; }
          warn() { :; }
          die() { printf 'ERROR: %s\n' "$*" >&2; return 1; }
          ask() { printf '%s\n' "${2:-}"; }
          confirm() { return 0; }
          source lib/sbx_bootstrap.sh
          test "$(bootstrap_image_repo /tmp/sbx-bootstrap.env)" = "ghcr.io/sagernet/sing-box"
          SING_BOX_IMAGE=registry.example.com/sagernet/sing-box docker compose --env-file .env.example -f compose.yml config | grep -F 'registry.example.com/sagernet/sing-box:v1.14.2'

      - name: Verify runtime image guard never pulls implicitly
        run: |
          export HOME_DIR="${{ github.workspace }}/.ci-image-home"
          export ENV="$HOME_DIR/.env"
          mkdir -p "$HOME_DIR/config" "$HOME_DIR/data"
          cp .env.example "$ENV"
          : > "$HOME_DIR/config/config.json"
          LOG=/tmp/sbx-image-docker.log
          : > "$LOG"
          envval() { grep -E "^$1=" "$ENV" | tail -n1 | cut -d= -f2- || printf '%s' "$2"; }
          info() { :; }
          warn() { :; }
          die() { printf 'ERROR: %s\n' "$*" >&2; return 1; }
          dc() { printf 'compose %s\n' "$*" >> "$LOG"; return 0; }
          status() { :; }
          running() { return 0; }
          http_test() { return 0; }
          python3() { command python3 "$@"; }
          bootstrap_ensure_image() {
            test "$3" = runtime
            printf 'bootstrap %s %s %s\n' "$1" "$2" "$3" >> "$LOG"
            return 1
          }
          docker() {
            printf 'docker %s\n' "$*" >> "$LOG"
            if [[ "$1" == "image" && "$2" == "inspect" ]]; then
              return 1
            fi
            return 0
          }
          source lib/sbx_image.sh
          if image_require; then
            echo "image_require unexpectedly succeeded" >&2
            exit 1
          fi
          ! grep -E 'docker (pull|compose .*pull)' "$LOG"
          grep -F 'bootstrap v1.14.2' "$LOG"

          : > "$LOG"
          docker() {
            printf 'docker %s\n' "$*" >> "$LOG"
            if [[ "$1" == "image" && "$2" == "inspect" ]]; then
              return 0
            fi
            return 0
          }
          check
          grep -F -- '--pull=never' "$LOG"
          grep -F -- '--pull never' lib/sbx_image.sh

      - name: Exercise Docker managed targets helper
        run: |
          rm -rf /tmp/sbx-target-test /tmp/sbx-target-bin
          mkdir -p /tmp/sbx-target-test /tmp/sbx-target-bin
          export SBX_HOME=/tmp/sbx-target-test
          export SBX_DOCKER_MANAGED_FILE=/tmp/sbx-target-test/docker-managed.json
          cat > /tmp/sbx-target-bin/docker <<'EOF'
          #!/usr/bin/env python3
          import json, os, sys
          args=sys.argv[1:]
          state=os.environ.get("FAKE_DOCKER_STATE","initial")
          containers={
            "initial":[
              {"Id":"aaa111","Name":"/new-api-old","Config":{"Image":"example/new-api:1","Labels":{"com.docker.compose.project":"new-api","com.docker.compose.service":"app"}},"State":{"Running":True},"NetworkSettings":{"Networks":{"bridge":{}}}},
              {"Id":"bbb222","Name":"/standalone","Config":{"Image":"example/app:1","Labels":{}},"State":{"Running":True},"NetworkSettings":{"Networks":{"bridge":{}}}}
            ],
            "updated":[
              {"Id":"ccc333","Name":"/new-api-new","Config":{"Image":"example/new-api:2","Labels":{"com.docker.compose.project":"new-api","com.docker.compose.service":"app"}},"State":{"Running":True},"NetworkSettings":{"Networks":{"bridge":{}}}},
              {"Id":"bbb222","Name":"/standalone","Config":{"Image":"example/app:1","Labels":{}},"State":{"Running":True},"NetworkSettings":{"Networks":{"bridge":{}}}}
            ]
          }[state]
          log=os.environ.get("FAKE_DOCKER_LOG")
          if args[:2]==["ps","-aq"]:
            print("\n".join(x["Id"] for x in containers)); raise SystemExit(0)
          if args and args[0]=="inspect":
            refs=args[1:]
            found=[]
            for ref in refs:
              for x in containers:
                if ref in (x["Id"], x["Id"][:12], x["Name"].lstrip("/")):
                  found.append(x); break
            if not found: raise SystemExit(1)
            print(json.dumps(found)); raise SystemExit(0)
          if args[:2]==["network","inspect"]:
            print("[]"); raise SystemExit(0)
          if args[:2]==["network","connect"]:
            if log:
              with open(log,"a") as f: f.write(" ".join(args)+"\n")
            raise SystemExit(0)
          raise SystemExit(1)
          EOF
          chmod +x /tmp/sbx-target-bin/docker
          export PATH="/tmp/sbx-target-bin:$PATH"
          export FAKE_DOCKER_LOG=/tmp/sbx-target-test/docker.log
          : > "$FAKE_DOCKER_LOG"

          python lib/sbx_docker_targets.py scan | grep -F 'new-api-old'
          python lib/sbx_docker_targets.py add new-api-old --inbound-id default | grep -F 'compose:new-api/app'
          python lib/sbx_docker_targets.py add standalone --inbound-id deadbeef | grep -F 'name:standalone'
          chmod 600 "$SBX_DOCKER_MANAGED_FILE"
          grep -F '"inbound_id": "default"' "$SBX_DOCKER_MANAGED_FILE"
          grep -F '"inbound_id": "deadbeef"' "$SBX_DOCKER_MANAGED_FILE"

          python lib/sbx_docker_targets.py list --network singbox-proxy | grep -F 'compose:new-api/app'
          python lib/sbx_docker_targets.py sync --network singbox-proxy
          grep -F 'network connect singbox-proxy new-api-old' "$FAKE_DOCKER_LOG"
          grep -F 'network connect singbox-proxy standalone' "$FAKE_DOCKER_LOG"

          : > "$FAKE_DOCKER_LOG"
          export FAKE_DOCKER_STATE=updated
          python lib/sbx_docker_targets.py sync --network singbox-proxy
          grep -F 'network connect singbox-proxy new-api-new' "$FAKE_DOCKER_LOG"
          grep -F 'network connect singbox-proxy standalone' "$FAKE_DOCKER_LOG"
          python lib/sbx_docker_targets.py remove compose:new-api/app
          ! grep -F 'compose:new-api/app' <(python lib/sbx_docker_targets.py list --network singbox-proxy)

      - name: Exercise Docker proxy verification
        run: |
          rm -rf /tmp/sbx-verify-home /tmp/sbx-verify-bin
          mkdir -p /tmp/sbx-verify-home/nodes /tmp/sbx-verify-bin
          export SBX_HOME=/tmp/sbx-verify-home
          export SBX_DOCKER_MANAGED_FILE=/tmp/sbx-verify-home/docker-managed.json
          cat > /tmp/sbx-verify-home/.env <<'EOF'
          SING_BOX_CONTAINER_NAME=sing-box
          SING_BOX_MIXED_PORT=7890
          SING_BOX_DOCKER_NETWORK=singbox-proxy
          EOF
          cat > /tmp/sbx-verify-home/nodes/nodes.json <<'EOF'
          {
            "version":3,
            "default":null,
            "settings":{"strategy":"manual","route_mode":"global","urltest":{"url":"https://www.gstatic.com/generate_204","interval":"3m","tolerance":50}},
            "subscriptions":[],
            "inbounds":[],
            "nodes":[]
          }
          EOF
          cat > /tmp/sbx-verify-home/docker-managed.json <<'EOF'
          {
            "version":1,
            "targets":[
              {"type":"compose","project":"newapi","service":"app","inbound_id":"default","last_name":"new-api-A"}
            ]
          }
          EOF
          cp lib/sbx_nodes.py /tmp/sbx-verify-home/lib-sbx_nodes.py
          mkdir -p /tmp/sbx-verify-home/lib
          cp lib/sbx_nodes.py /tmp/sbx-verify-home/lib/sbx_nodes.py
          cp lib/sbx_docker_targets.py /tmp/sbx-verify-home/lib/sbx_docker_targets.py

          cat > /tmp/sbx-verify-bin/docker <<'EOF'
          #!/usr/bin/env python3
          import json,sys
          args=sys.argv[1:]
          target={
            "Id":"aaa111","Name":"/new-api-A",
            "Config":{"Image":"example/new-api:1","Labels":{"com.docker.compose.project":"newapi","com.docker.compose.service":"app"},"Env":["HTTP_PROXY=http://sing-box:7890","HTTPS_PROXY=http://sing-box:7890"]},
            "State":{"Running":True,"Pid":4321},
            "NetworkSettings":{"Networks":{"singbox-proxy":{"IPAddress":"172.30.0.3"}}}
          }
          sbx={
            "Id":"sss111","Name":"/sing-box",
            "Config":{"Image":"ghcr.io/sagernet/sing-box:v1.14.2","Labels":{},"Env":[]},
            "State":{"Running":True,"Pid":4322},
            "NetworkSettings":{"Networks":{"singbox-proxy":{"IPAddress":"172.30.0.2"}}}
          }
          items=[target,sbx]
          if args[:2]==["ps","-aq"]:
            print("aaa111\nsss111"); raise SystemExit(0)
          if args and args[0]=="inspect":
            refs=args[1:]
            out=[]
            for ref in refs:
              for item in items:
                if ref in (item["Id"],item["Name"].lstrip("/")):
                  out.append(item); break
            if not out: raise SystemExit(1)
            print(json.dumps(out)); raise SystemExit(0)
          if args[:2]==["network","inspect"]:
            print(json.dumps([{
              "Name":"singbox-proxy",
              "Containers":{
                "aaa111":{"Name":"new-api-A","IPv4Address":"172.30.0.3/16"},
                "sss111":{"Name":"sing-box","IPv4Address":"172.30.0.2/16"}
              }
            }])); raise SystemExit(0)
          raise SystemExit(1)
          EOF
          chmod +x /tmp/sbx-verify-bin/docker

          cat > /tmp/sbx-verify-bin/systemctl <<'EOF'
          #!/usr/bin/env bash
          if [[ "$1" == "is-active" ]]; then exit 0; fi
          exit 1
          EOF
          chmod +x /tmp/sbx-verify-bin/systemctl
          export PATH="/tmp/sbx-verify-bin:$PATH"

          python lib/sbx_verify.py docker new-api-A --quick | tee /tmp/sbx-verify.out
          grep -F 'PASS  容器运行中: new-api-A' /tmp/sbx-verify.out
          grep -F 'PASS  目标容器已加入 singbox-proxy' /tmp/sbx-verify.out
          grep -F 'PASS  托管关系: new-api-A -> [default] 默认入口 -> :7890' /tmp/sbx-verify.out
          grep -F 'PASS  容器代理环境变量指向 sing-box:7890' /tmp/sbx-verify.out
          grep -F 'PASS  Watcher 正在运行' /tmp/sbx-verify.out
          grep -F 'FAIL=0' /tmp/sbx-verify.out

      - name: Exercise Docker shared proxy network
        run: |
          export HOME_DIR="${{ github.workspace }}/.ci-docker-net-home"
          export SBX_HOME="$HOME_DIR"
          export ENV="$HOME_DIR/.env"
          export NODES="$HOME_DIR/nodes/nodes.json"
          export HELPER="${{ github.workspace }}/lib/sbx_nodes.py"
          export SBX_DOCKER_NETWORK_COMPOSE="$HOME_DIR/compose.network.yml"
          export SBX_DOCKER_NETWORK_NO_APPLY=1
          export SBX_DOCKER_WATCH_NO_APPLY=1
          export SBX_DOCKER_WATCH_SERVICE="$HOME_DIR/singbox-manager-docker-watch.service"
          export SBX_DOCKER_WATCH_BIN="${{ github.workspace }}/bin/sbx-docker-watch"
          export SBX_DOCKER_TARGET_HELPER="${{ github.workspace }}/lib/sbx_docker_targets.py"
          export SBX_DOCKER_MANAGED_FILE="$HOME_DIR/docker-managed.json"
          mkdir -p "$HOME_DIR/nodes"
          cp .env.example "$ENV"
          cp .ci-home/nodes/nodes.json "$NODES"
          envval() { grep -E "^$1=" "$ENV" 2>/dev/null | tail -n1 | cut -d= -f2- || printf '%s' "$2"; }
          setenv() { local k="$1" v="$2" t; t=$(mktemp); awk -v k="$k" -v v="$v" 'BEGIN{f=0} index($0,k"=")==1{print k"="v;f=1;next}{print} END{if(!f)print k"="v}' "$ENV">"$t"; cat "$t">"$ENV"; rm -f "$t"; }
          info() { :; }
          warn() { :; }
          die() { printf 'ERROR: %s\n' "$*" >&2; return 1; }
          running() { return 1; }
          pause() { :; }
          source lib/sbx_docker_network.sh

          NET="sbx-ci-proxy-${{ github.run_id }}"
          trap 'docker network rm "$NET" >/dev/null 2>&1 || true' EXIT
          docker_network_on "$NET"
          docker network inspect "$NET" >/dev/null

          docker compose \
            --env-file "$ENV" \
            -f compose.yml \
            -f "$SBX_DOCKER_NETWORK_COMPOSE" \
            config >/tmp/sbx-network-compose.yml

          grep -F 'name: '"$NET" /tmp/sbx-network-compose.yml
          grep -F 'sing-box' /tmp/sbx-network-compose.yml
          grep -F 'aliases:' /tmp/sbx-network-compose.yml
          grep -F 'external: true' /tmp/sbx-network-compose.yml

          chosen_id="$(printf '1\n' | docker_network_choose_inbound 2>/tmp/sbx-inbound-ui.txt)"
          test "$chosen_id" = "default"
          grep -F '可用代理入口：' /tmp/sbx-inbound-ui.txt
          grep -F '1. [default]' /tmp/sbx-inbound-ui.txt

          SECOND_ID="$(python lib/sbx_nodes.py inbound-endpoints --json | python -c 'import json,sys; print(json.load(sys.stdin)[1]["id"])')"
          chosen_second="$(printf '2\n' | docker_network_choose_inbound 2>/tmp/sbx-inbound-ui-2.txt)"
          test "$chosen_second" = "$SECOND_ID"
          grep -F '2. ['"$SECOND_ID"']' /tmp/sbx-inbound-ui-2.txt
          docker_network_urls | grep -F '[default] 默认入口'
          docker_network_env default | grep -F "HTTP_PROXY='http://sing-box:7890'"
          CUSTOM_INBOUND_ID="$(python lib/sbx_nodes.py inbound-endpoints --json | python -c 'import json,sys; x=json.load(sys.stdin); print(x[1]["id"])')"
          test -n "$CUSTOM_INBOUND_ID"
          docker_network_env "$CUSTOM_INBOUND_ID" | grep -F "HTTP_PROXY='http://sing-box:7891'"
          docker_network_snippet "$CUSTOM_INBOUND_ID" | grep -F 'HTTP_PROXY: http://sing-box:7891'

          python lib/sbx_nodes.py inbound-edit "$CUSTOM_INBOUND_ID" \
            --name HK-entry --listen 127.0.0.1 --port 7991 --target node:11111111
          docker_network_env "$CUSTOM_INBOUND_ID" | grep -F "HTTP_PROXY='http://sing-box:7991'"

          cat > "$SBX_DOCKER_MANAGED_FILE" <<'EOF'
          {"version":1,"targets":[{"type":"name","name":"legacy-app","port":7890}]}
          EOF
          docker_network_migrate_legacy_targets
          grep -F '"inbound_id": "default"' "$SBX_DOCKER_MANAGED_FILE"
          ! grep -F '"port":' "$SBX_DOCKER_MANAGED_FILE"
          docker_network_status | grep -F 'Docker网络: READY'
          docker_network_watch_on
          grep -F 'ExecStart=' "$SBX_DOCKER_WATCH_SERVICE"
          grep -F 'Environment="SBX_HOME=' "$SBX_DOCKER_WATCH_SERVICE"
          docker_network_watch_status | grep -F 'Watcher: CONFIGURED'
          docker_network_watch_off
          test ! -e "$SBX_DOCKER_WATCH_SERVICE"

          docker_network_off
          test ! -e "$SBX_DOCKER_NETWORK_COMPOSE"
          docker network rm "$NET" >/dev/null
          trap - EXIT

      - name: Exercise host proxy config generation
        run: |
          export HOME_DIR="${{ github.workspace }}/.ci-home"
          export ENV="${{ github.workspace }}/.ci-proxy.env"
          export SBX_PROXY_STATE_DIR="${{ github.workspace }}/.ci-proxy-state"
          export SBX_DOCKER_DROPIN_DIR="${{ github.workspace }}/.ci-systemd"
          export SBX_DOCKER_PROXY_FILE="$SBX_DOCKER_DROPIN_DIR/99-singbox-manager-proxy.conf"
          export SBX_APT_PROXY_FILE="${{ github.workspace }}/.ci-apt/99singbox-manager-proxy"
          export SBX_GIT_PROXY_FILE="${{ github.workspace }}/.ci-git/git-proxy.conf"
          export SBX_PROXY_NO_APPLY=1
          mkdir -p "$HOME_DIR" "$SBX_PROXY_STATE_DIR"
          cp .env.example "$ENV"
          envval() { grep -E "^$1=" "$ENV" | tail -n1 | cut -d= -f2- || printf '%s' "$2"; }
          running() { return 0; }
          dc() { return 0; }
          info() { :; }
          warn() { :; }
          die() { printf 'ERROR: %s\n' "$*" >&2; return 1; }
          source lib/sbx_proxy.sh
          proxy_apt_on
          proxy_docker_on
          grep -F 'Acquire::https::Proxy "http://127.0.0.1:7890";' "$SBX_APT_PROXY_FILE"
          grep -F 'Environment="HTTPS_PROXY=http://127.0.0.1:7890"' "$SBX_DOCKER_PROXY_FILE"
          proxy_env | grep -F "export HTTPS_PROXY='http://127.0.0.1:7890'"

      - name: Validate generated config with sing-box
        env:
          SBX_HOME: ${{ github.workspace }}/.ci-home
        run: |
          docker run --rm \
            -v "$SBX_HOME/config:/etc/sing-box:ro" \
            ghcr.io/sagernet/sing-box:v1.14.2 \
            check -c /etc/sing-box/config.json -D /tmp/sing-box
