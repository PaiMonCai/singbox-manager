          cp .ci-home/nodes/nodes.json "$NODES"
          envval() { grep -E "^$1=" "$ENV" 2>/dev/null | tail -n1 | cut -d= -f2- || printf '%s' "$2"; }
          setenv() { local k="$1" v="$2" t; t=$(mktemp); awk -v k="$k" -v v="$v" 'BEGIN{f=0} index($0,k"=")==1{print k"="v;f=1;next}{print} END{if(!f)print k"="v}' "$ENV">"$t"; cat "$t">"$ENV"; rm -f "$t"; }
          info() { :; }
          warn() { :; }
          die() { printf 'ERROR: %s\n' "$*" >&2; return 1; }
          running() { return 1; }
          pause() { :; }
          source lib/sbx_docker_network.sh

          NET="sbx-ci-proxy-${{ github.run_id }}"
          trap 'docker network rm "$NET" >/dev/null 2>&1 || true' EXIT
          docker_network_on "$NET"
          docker network inspect "$NET" >/dev/null

          docker compose \
            --env-file "$ENV" \
            -f compose.yml \
            -f "$SBX_DOCKER_NETWORK_COMPOSE" \
            config >/tmp/sbx-network-compose.yml

          grep -F 'name: '"$NET" /tmp/sbx-network-compose.yml
          grep -F 'sing-box' /tmp/sbx-network-compose.yml
          grep -F 'aliases:' /tmp/sbx-network-compose.yml
          grep -F 'external: true' /tmp/sbx-network-compose.yml

          chosen_id="$(printf '1\n' | docker_network_choose_inbound 2>/tmp/sbx-inbound-ui.txt)"
          test "$chosen_id" = "default"
          grep -F '可用代理入口：' /tmp/sbx-inbound-ui.txt
          grep -F '1. [default]' /tmp/sbx-inbound-ui.txt

          SECOND_ID="$(python lib/sbx_nodes.py inbound-endpoints --json | python -c 'import json,sys; print(json.load(sys.stdin)[1]["id"])')"
          chosen_second="$(printf '2\n' | docker_network_choose_inbound 2>/tmp/sbx-inbound-ui-2.txt)"
          test "$chosen_second" = "$SECOND_ID"
          grep -F '2. ['"$SECOND_ID"']' /tmp/sbx-inbound-ui-2.txt
          docker_network_urls | grep -F '[default] 默认入口'
          docker_network_env default | grep -F "HTTP_PROXY='http://sing-box:7890'"
          CUSTOM_INBOUND_ID="$(python lib/sbx_nodes.py inbound-endpoints --json | python -c 'import json,sys; x=json.load(sys.stdin); print(x[1]["id"])')"
          test -n "$CUSTOM_INBOUND_ID"
          docker_network_env "$CUSTOM_INBOUND_ID" | grep -F "HTTP_PROXY='http://sing-box:7891'"
          docker_network_snippet "$CUSTOM_INBOUND_ID" | grep -F 'HTTP_PROXY: http://sing-box:7891'

          python lib/sbx_nodes.py inbound-edit "$CUSTOM_INBOUND_ID" \
            --name HK-entry --listen 127.0.0.1 --port 7991 --target node:11111111
          docker_network_env "$CUSTOM_INBOUND_ID" | grep -F "HTTP_PROXY='http://sing-box:7991'"

          cat > "$SBX_DOCKER_MANAGED_FILE" <<'EOF'
          {"version":1,"targets":[{"type":"name","name":"legacy-app","port":7890}]}
          EOF
          docker_network_migrate_legacy_targets
          grep -F '"inbound_id": "default"' "$SBX_DOCKER_MANAGED_FILE"
          ! grep -F '"port":' "$SBX_DOCKER_MANAGED_FILE"
          docker_network_status | grep -F 'Docker网络: READY'
          docker_network_watch_on
          grep -F 'ExecStart=' "$SBX_DOCKER_WATCH_SERVICE"
          grep -F 'Environment="SBX_HOME=' "$SBX_DOCKER_WATCH_SERVICE"
          docker_network_watch_status | grep -F 'Watcher: CONFIGURED'
          docker_network_watch_off
          test ! -e "$SBX_DOCKER_WATCH_SERVICE"

          docker_network_off
          test ! -e "$SBX_DOCKER_NETWORK_COMPOSE"
          docker network rm "$NET" >/dev/null
          trap - EXIT

      - name: Exercise host proxy config generation
        run: |
          export HOME_DIR="${{ github.workspace }}/.ci-home"
          export ENV="${{ github.workspace }}/.ci-proxy.env"
          export SBX_PROXY_STATE_DIR="${{ github.workspace }}/.ci-proxy-state"
          export SBX_DOCKER_DROPIN_DIR="${{ github.workspace }}/.ci-systemd"
          export SBX_DOCKER_PROXY_FILE="$SBX_DOCKER_DROPIN_DIR/99-singbox-manager-proxy.conf"
          export SBX_APT_PROXY_FILE="${{ github.workspace }}/.ci-apt/99singbox-manager-proxy"
          export SBX_GIT_PROXY_FILE="${{ github.workspace }}/.ci-git/git-proxy.conf"
          export SBX_PROXY_NO_APPLY=1
          mkdir -p "$HOME_DIR" "$SBX_PROXY_STATE_DIR"
          cp .env.example "$ENV"
          envval() { grep -E "^$1=" "$ENV" | tail -n1 | cut -d= -f2- || printf '%s' "$2"; }
          running() { return 0; }
          dc() { return 0; }
          info() { :; }
          warn() { :; }
          die() { printf 'ERROR: %s\n' "$*" >&2; return 1; }
          source lib/sbx_proxy.sh
          proxy_apt_on
          proxy_docker_on
          grep -F 'Acquire::https::Proxy "http://127.0.0.1:7890";' "$SBX_APT_PROXY_FILE"
          grep -F 'Environment="HTTPS_PROXY=http://127.0.0.1:7890"' "$SBX_DOCKER_PROXY_FILE"
          proxy_env | grep -F "export HTTPS_PROXY='http://127.0.0.1:7890'"

      - name: Validate generated config with sing-box
        env:
          SBX_HOME: ${{ github.workspace }}/.ci-home
        run: |
          docker run --rm \
            -v "$SBX_HOME/config:/etc/sing-box:ro" \
            ghcr.io/sagernet/sing-box:v1.14.2 \
            check -c /etc/sing-box/config.json -D /tmp/sing-box
