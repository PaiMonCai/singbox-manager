name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          bash -n install.sh
          bash -n bin/sbx
          bash -n lib/sbx_v3.sh
          bash -n lib/sbx_proxy.sh
          bash -n lib/sbx_bootstrap.sh
          bash -n lib/sbx_image.sh
          bash -n lib/sbx_inbound.sh
          bash -n lib/sbx_docker_network.sh
          bash -n bin/sbx-docker-watch
          bash -n lib/sbx_update.sh
          bash -n bin/sbx-install

      - name: ShellCheck (errors gate)
        run: |
          shellcheck --version
          shellcheck -S error \
            install.sh bin/sbx bin/sbx-install bin/sbx-docker-watch \
            lib/sbx_bootstrap.sh lib/sbx_docker_network.sh lib/sbx_image.sh \
            lib/sbx_inbound.sh lib/sbx_proxy.sh lib/sbx_update.sh lib/sbx_v3.sh

      - name: ShellCheck (warnings, advisory)
        continue-on-error: true
        run: |
          shellcheck -S warning \
            install.sh bin/sbx bin/sbx-install bin/sbx-docker-watch \
            lib/sbx_bootstrap.sh lib/sbx_docker_network.sh lib/sbx_image.sh \
            lib/sbx_inbound.sh lib/sbx_proxy.sh lib/sbx_update.sh lib/sbx_v3.sh

      - name: Python syntax
        run: |
          python -m py_compile lib/sbx_nodes.py
          python -m py_compile lib/sbx_docker_targets.py
          python -m py_compile lib/sbx_verify.py

      - name: Verify installer prefers raw source
        run: |
          grep -F 'SBX_SOURCE_BASE_URL' install.sh
          grep -F 'raw.githubusercontent.com' install.sh
          grep -F 'raw 源不可用，回退 GitHub archive' install.sh
          grep -F 'lib/sbx_inbound.sh' install.sh
          grep -F 'lib/sbx_docker_network.sh' install.sh
          grep -F 'lib/sbx_docker_targets.py' install.sh
          grep -F 'lib/sbx_verify.py' install.sh
          grep -F 'bin/sbx-docker-watch' install.sh
          grep -F 'lib/sbx_update.sh' install.sh
          grep -F 'bin/sbx-install' install.sh
          grep -F 'VERSION' install.sh
          awk '/get_source\(\)/,/read_env_value\(\)/' install.sh | grep -F 'SOURCE_BASE_URL'
          awk '/get_source\(\)/,/read_env_value\(\)/' install.sh | grep -F 'ARCHIVE_URL'

      - name: Verify concurrent source racing is wired in
        run: |
          grep -F 'SBX_SOURCE_MIRRORS' install.sh
          grep -F 'SBX_MIRROR_PRESET' install.sh
          grep -F 'SBX_SOURCE_NO_RACE' install.sh
          grep -F 'SBX_SOURCE_CONCURRENCY' install.sh
          grep -F 'fetch_one_file_ranked' install.sh
          grep -F '并发测速' install.sh
          grep -F 'cdn.jsdelivr.net' install.sh
          grep -F 'codeload.github.com' install.sh
          grep -F 'race_sources' install.sh
          grep -F 'fetch_files_missing' install.sh
          grep -F 'source_probe_one' install.sh
          # 入口与自更新同样参与抢速
          grep -F 'race_fetch' bin/sbx-install
          grep -F 'SBX_MIRROR_PRESET' bin/sbx-install
          grep -F 'manager_race_fetch' lib/sbx_update.sh
          grep -F 'manager_candidate_bases' lib/sbx_update.sh
          grep -F 'manager_resolve_remote_version' lib/sbx_update.sh
          grep -F 'RACE_PREFER_BASES' lib/sbx_update.sh
          grep -F 'order_candidates_by_version' bin/sbx-install
          grep -F 'source_version_cmp' install.sh

      - name: Exercise installer source race (fastest wins, failover)
        run: |
          set -e
          RACE=/tmp/sbx-race
          rm -rf "$RACE"
          mkdir -p "$RACE/fake-bin" "$RACE/fixtures" "$RACE/work"

          # 假 curl：把 URL 映射到 fixture，用延迟模拟不同源的速率（缺失文件 → 404）
          cat > "$RACE/fake-bin/curl" <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          out=""; wfmt=""; url=""; proxy=""
          while [ "$#" -gt 0 ]; do
            case "$1" in
              -o) out="$2"; shift 2 ;;
              -w) wfmt="$2"; shift 2 ;;
              --proxy) proxy="$2"; shift 2 ;;
              -A|--connect-timeout|--max-time|--retry|--retry-delay) shift 2 ;;
              -*) shift ;;
              *) url="$1"; shift ;;
            esac
          done
          [ -n "$url" ] || exit 2
          url="${url%%\?*}"   # 忽略缓存破坏参数
          if [ -n "${SBX_TEST_REQUIRE_PROXY:-}" ] && [ -z "$proxy" ]; then exit 28; fi
          delay=""; template=""
          while IFS=$'\t' read -r prefix delay template; do
            [ -n "$prefix" ] || continue
            case "$url" in
              "$prefix"*) rel="${url#"$prefix"}"; rel="${rel#/}"; break ;;
            esac
            delay=""; template=""
          done < "$SBX_TEST_MAP"
          if [ -z "$template" ]; then
            printf 'curl: (22) The requested URL returned error: 404\n' >&2
            exit 22
          fi
          file="$SBX_TEST_FIXTURES/${template//\{rel\}/$rel}"
          if [ ! -f "$file" ]; then
            printf 'curl: (22) The requested URL returned error: 404\n' >&2
            exit 22
          fi
          size="$(wc -c < "$file" | tr -d ' ')"
          if [ -n "$delay" ] && [ "$delay" -gt 0 ]; then
            sleep "$(awk "BEGIN{printf \"%.3f\", $delay/1000}")"
            speed="$(awk "BEGIN{printf \"%.3f\", $size/(($delay)/1000)}")"
          else
            speed="$(( size * 1024 ))"
          fi
          if [ -n "$out" ]; then cat "$file" > "$out"; else cat "$file"; fi
          if [ -n "$wfmt" ]; then
            result="$wfmt"
            result="${result//\%\{http_code\}/200}"
            result="${result//\%\{size_download\}/$size}"
            result="${result//\%\{speed_download\}/$speed}"
            printf '%s' "$result"
          fi
          exit 0
          SH
          chmod +x "$RACE/fake-bin/curl"

          # fixture：快源 / 慢源 / 快源缺 VERSION（直接把抓取清单从 install.sh 里取出来，避免清单漂移）
          REQUIRED="$(awk '/^SOURCE_REQUIRED=\(/,/^\)/' install.sh | grep -o '"[^"]*"' | tr -d '"')"
          test "$(printf '%s\n' $REQUIRED | wc -l)" -eq 17
          for src in fast slow fast-nv; do
            for f in $REQUIRED; do
              if [ "$f" = "VERSION" ] && [ "$src" = "fast-nv" ]; then continue; fi
              mkdir -p "$RACE/fixtures/$src/$(dirname "$f")"
              cp "$f" "$RACE/fixtures/$src/$f"
            done
            # 让两个源的 bin/sbx 内容可区分，用来判断某个文件实际来自哪个源
            { printf '# source=%s\n' "$src"; cat "$RACE/fixtures/$src/bin/sbx"; } > "$RACE/fixtures/$src/bin/sbx.tmp"
            mv "$RACE/fixtures/$src/bin/sbx.tmp" "$RACE/fixtures/$src/bin/sbx"
          done
          printf '9.9.9-fast\n' > "$RACE/fixtures/fast/VERSION"
          printf '9.9.9-slow\n' > "$RACE/fixtures/slow/VERSION"

          RAW='https://raw.githubusercontent.com/PaiMonCai/singbox-manager/main'
          JSD='https://cdn.jsdelivr.net/gh/PaiMonCai/singbox-manager@main'
          ARCH='https://github.com/PaiMonCai/singbox-manager/archive/refs/heads/main.tar.gz'
          printf '%s\t1200\tslow/{rel}\n%s\t100\tfast/{rel}\n%s\t100\tmissing.tar.gz\n' "$RAW" "$JSD" "$ARCH" > "$RACE/m1.map"
          printf '%s\t1200\tslow/{rel}\n%s\t100\tfast-nv/{rel}\n%s\t100\tmissing.tar.gz\n' "$RAW" "$JSD" "$ARCH" > "$RACE/m2.map"

          run_case() { # name map [额外的环境变量...]
            local name="$1" map="$2"; shift 2
            local d="$RACE/work/$name"
            rm -rf "$d"; mkdir -p "$d/only" "$d/install" "$d/binlink"
            printf 'SING_BOX_IMAGE=ghcr.io/sagernet/sing-box\nSING_BOX_VERSION=v1.14.2\n' > "$d/install/.env"
            cp install.sh "$d/only/install.sh"
            (
              cd "$d/only"
              sudo env PATH="$RACE/fake-bin:$PATH" \
                SBX_TEST_MAP="$map" SBX_TEST_FIXTURES="$RACE/fixtures" \
                SBX_MANAGER_ONLY=1 SBX_NONINTERACTIVE=1 \
                SBX_INSTALL_DIR="$d/install" \
                SBX_BIN_LINK="$d/binlink/sbx" \
                SBX_INSTALLER_LINK="$d/binlink/sbx-install" \
                SBX_SOURCE_PROBE_TIMEOUT=3 \
                "$@" \
                bash install.sh > "$d/run.log" 2>&1
            )
          }

          # 1) 最快者胜出
          run_case fastest "$RACE/m1.map"
          grep -F '正在并发测速' "$RACE/work/fastest/run.log"
          grep -F '首选 jsdelivr' "$RACE/work/fastest/run.log"
          test "$(tr -d '[:space:]' < "$RACE/work/fastest/install/VERSION")" = '9.9.9-fast'
          grep -q 'source=fast' "$RACE/work/fastest/install/bin/sbx"
          cmp "$RACE/work/fastest/install/lib/sbx_nodes.py" lib/sbx_nodes.py

          # 2) 最快源缺某个文件 → 只把这个文件换到次优源，其余仍用最快源
          run_case failover "$RACE/m2.map"
          grep -F '切换到下一个候选源' "$RACE/work/failover/run.log"
          test "$(tr -d '[:space:]' < "$RACE/work/failover/install/VERSION")" = '9.9.9-slow'
          grep -q 'source=fast' "$RACE/work/failover/install/bin/sbx"

          # 3) 并发文件数可调；=1 时必须回到顺序下载且结果一致
          run_case sequential "$RACE/m1.map" SBX_SOURCE_CONCURRENCY=1
          grep -F '并发 1' "$RACE/work/sequential/run.log"
          test "$(tr -d '[:space:]' < "$RACE/work/sequential/install/VERSION")" = '9.9.9-fast'
          grep -q 'source=fast' "$RACE/work/sequential/install/bin/sbx"

          # 4) 命中 CDN 分支缓存的旧源再快也不能胜出（jsDelivr @branch 可缓存 12 小时）
          mkdir -p "$RACE/fixtures/stale" "$RACE/fixtures/fresh"
          cp -a "$RACE/fixtures/fast/." "$RACE/fixtures/stale/"
          printf '0.11.2\n' > "$RACE/fixtures/stale/VERSION"
          cp -a "$RACE/fixtures/slow/." "$RACE/fixtures/fresh/"
          printf '0.11.4\n' > "$RACE/fixtures/fresh/VERSION"
          printf '%s\t100\tstale/{rel}\n%s\t1200\tfresh/{rel}\n%s\t100\tmissing.tar.gz\n' "$RAW" "$JSD" "$ARCH" > "$RACE/m5.map"
          run_case stale "$RACE/m5.map"
          test "$(tr -d '[:space:]' < "$RACE/work/stale/install/VERSION")" = '0.11.4'
          grep -q 'source=slow' "$RACE/work/stale/install/bin/sbx"
          grep -F '过期' "$RACE/work/stale/run.log"

      - name: Exercise launcher and updater source race
        run: |
          set -e
          RACE=/tmp/sbx-race
          RAW='https://raw.githubusercontent.com/PaiMonCai/singbox-manager/main'
          JSD='https://cdn.jsdelivr.net/gh/PaiMonCai/singbox-manager@main'

          mkdir -p "$RACE/fixtures/fastdir" "$RACE/fixtures/slowdir"
          printf '#!/usr/bin/env bash\necho WINNER=fast\n' > "$RACE/fixtures/fastdir/install.sh"
          printf '#!/usr/bin/env bash\necho WINNER=slow\n' > "$RACE/fixtures/slowdir/install.sh"
          printf '9.9.9-fast\n' > "$RACE/fixtures/fast.version"
          printf '0.11.1\n' > "$RACE/fixtures/slow.version"
          # 慢源放在官方 raw、快源放在 jsDelivr，用来验证"快的那个胜出"
          printf '%s\t1200\tslowdir/{rel}\n%s\t100\tfastdir/{rel}\n' "$RAW" "$JSD" > "$RACE/m3.map"
          printf '%s\t1200\tslow.version\n%s\t100\tfast.version\n' "$RAW" "$JSD" > "$RACE/m4.map"

          # sbx-install：并发请求多个 install.sh 源，最先完整下载完成的胜出
          out="$(sudo env PATH="$RACE/fake-bin:$PATH" SBX_TEST_MAP="$RACE/m3.map" \
            SBX_TEST_FIXTURES="$RACE/fixtures" bash bin/sbx-install)"
          printf '%s\n' "$out" | grep -F '同时尝试 2 个下载源'
          printf '%s\n' "$out" | grep -F 'WINNER=fast'
          printf '%s\n' "$out" | grep -F 'cdn.jsdelivr.net'

          # 显式 SBX_INSTALL_URL 时只用该地址，不做并发
          out="$(sudo env PATH="$RACE/fake-bin:$PATH" SBX_TEST_MAP="$RACE/m3.map" \
            SBX_TEST_FIXTURES="$RACE/fixtures" SBX_INSTALL_URL="$RAW/install.sh" bash bin/sbx-install)"
          printf '%s\n' "$out" | grep -F 'WINNER=slow'
          if printf '%s\n' "$out" | grep -F '同时尝试'; then
            echo '显式单源时不应并发' >&2; exit 1
          fi

          # manager_remote_version：远端版本号取所有候选里的最大版本，
          # 不能取“最快返回者”——命中 CDN 缓存的旧源往往更快
          ver="$(sudo env PATH="$RACE/fake-bin:$PATH" SBX_TEST_MAP="$RACE/m4.map" \
            SBX_TEST_FIXTURES="$RACE/fixtures" bash -c '
              HOME_DIR=/tmp/sbx-race/home
              info(){ :; }
              warn(){ :; }
              die(){ printf "ERROR: %s\n" "$*" >&2; return 1; }
              source lib/sbx_update.sh
              manager_remote_version')"
          test "$ver" = '9.9.9-fast'

          # 更快但版本过期的源不能胜出（sbx-install 只在“报告最新版本”的来源里抢速）
          mkdir -p "$RACE/fixtures/launcher-stale" "$RACE/fixtures/launcher-fresh"
          printf '#!/usr/bin/env bash\necho WINNER=stale\n' > "$RACE/fixtures/launcher-stale/install.sh"
          printf '0.11.2\n' > "$RACE/fixtures/launcher-stale/VERSION"
          printf '#!/usr/bin/env bash\necho WINNER=fresh\n' > "$RACE/fixtures/launcher-fresh/install.sh"
          printf '0.11.4\n' > "$RACE/fixtures/launcher-fresh/VERSION"
          printf '%s\t50\tlauncher-stale/{rel}\n%s\t1200\tlauncher-fresh/{rel}\n' "$RAW" "$JSD" > "$RACE/m5.map"
          out="$(sudo env PATH="$RACE/fake-bin:$PATH" SBX_TEST_MAP="$RACE/m5.map" \
            SBX_TEST_FIXTURES="$RACE/fixtures" bash bin/sbx-install)"
          printf '%s\n' "$out" | grep -F 'WINNER=fresh'

          # 版本号同样取最大：过期源(0.11.2)更快，但远端版本必须读成 0.11.4
          ver="$(sudo env PATH="$RACE/fake-bin:$PATH" SBX_TEST_MAP="$RACE/m5.map" \
            SBX_TEST_FIXTURES="$RACE/fixtures" bash -c '
              HOME_DIR=/tmp/sbx-race/home
              info(){ :; }
              warn(){ :; }
              die(){ printf "ERROR: %s\n" "$*" >&2; return 1; }
              source lib/sbx_update.sh
              manager_remote_version')"
          test "$ver" = '0.11.4'

      - name: Exercise manager-only update mode
        run: |
          EXPECTED_MANAGER_VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$EXPECTED_MANAGER_VERSION"
          rm -rf /tmp/sbx-manager-only /tmp/sbx-ci-bin
          mkdir -p /tmp/sbx-manager-only/nodes /tmp/sbx-manager-only/config /tmp/sbx-ci-bin
          cat > /tmp/sbx-manager-only/.env <<'EOF'
          SING_BOX_IMAGE=ghcr.io/sagernet/sing-box
          SING_BOX_VERSION=v1.14.2
          SING_BOX_CONTAINER_NAME=sing-box
          SING_BOX_BIND_ADDR=127.0.0.1
          SING_BOX_MIXED_PORT=7890
          EOF
          cat > /tmp/sbx-manager-only/nodes/nodes.json <<'EOF'
          {"sentinel":"nodes-unchanged"}
          EOF
          cat > /tmp/sbx-manager-only/config/config.json <<'EOF'
          {"sentinel":"config-unchanged"}
          EOF
          sha256sum /tmp/sbx-manager-only/.env /tmp/sbx-manager-only/nodes/nodes.json /tmp/sbx-manager-only/config/config.json > /tmp/before.sha
          sudo env \
            SBX_MANAGER_ONLY=1 \
            SBX_NONINTERACTIVE=1 \
            SBX_INSTALL_DIR=/tmp/sbx-manager-only \
            SBX_BIN_LINK=/tmp/sbx-ci-bin/sbx \
            SBX_INSTALLER_LINK=/tmp/sbx-ci-bin/sbx-install \
            bash install.sh
          sha256sum -c /tmp/before.sha
          test "$(tr -d '[:space:]' < /tmp/sbx-manager-only/VERSION)" = "$EXPECTED_MANAGER_VERSION"
          test -x /tmp/sbx-ci-bin/sbx-install
          test -x /tmp/sbx-manager-only/lib/sbx_update.sh
          test -x /tmp/sbx-manager-only/lib/sbx_docker_targets.py
          test -x /tmp/sbx-manager-only/lib/sbx_verify.py
          test -x /tmp/sbx-manager-only/bin/sbx-docker-watch

      - name: Exercise installed CLI
        run: |
          test -x /tmp/sbx-ci-bin/sbx
          sudo env SBX_HOME=/tmp/sbx-manager-only /tmp/sbx-ci-bin/sbx help >/dev/null
          sudo env SBX_HOME=/tmp/sbx-manager-only /tmp/sbx-ci-bin/sbx image ref
          sudo env SBX_HOME=/tmp/sbx-manager-only /tmp/sbx-ci-bin/sbx proxy status
          sudo env SBX_HOME=/tmp/sbx-manager-only /tmp/sbx-ci-bin/sbx manager auto status
          # 上面的 HOME 里 nodes.json 是“不得改动”的哨兵文件，换成合法空库后再跑涉及节点库的命令
          sudo rm -f /tmp/sbx-manager-only/nodes/nodes.json
          sudo env SBX_HOME=/tmp/sbx-manager-only python3 /tmp/sbx-manager-only/lib/sbx_nodes.py init >/dev/null
          sudo env SBX_HOME=/tmp/sbx-manager-only /tmp/sbx-ci-bin/sbx node list
          sudo env SBX_HOME=/tmp/sbx-manager-only /tmp/sbx-ci-bin/sbx version
          # 安装不完整时必须给出可读报错，而不是 "main: command not found"
          rm -rf /tmp/sbx-broken && mkdir -p /tmp/sbx-broken
          if sudo env SBX_HOME=/tmp/sbx-broken /tmp/sbx-ci-bin/sbx status 2>/tmp/sbx-broken.err; then
            echo "缺 lib 时不应成功" >&2
            exit 1
          fi
          grep -F '安装不完整' /tmp/sbx-broken.err

      - name: Exercise node index selection
        run: |
          set -e
          NODE_HOME=/tmp/sbx-node-index
          sudo rm -rf "$NODE_HOME"
          # 节点库权限是 600 且由 sudo 写；本步骤所有读写统一用 sudo，避免跨用户权限差异
          sudo mkdir -p "$NODE_HOME/nodes" "$NODE_HOME/config" "$NODE_HOME/data" "$NODE_HOME/backup"
          sudo cp -a lib bin compose.yml "$NODE_HOME/"
          sudo tee "$NODE_HOME/.env" >/dev/null <<'ENV'
          SING_BOX_IMAGE=ghcr.io/sagernet/sing-box
          SING_BOX_VERSION=v1.14.2
          SING_BOX_CONTAINER_NAME=sing-box
          SING_BOX_BIND_ADDR=127.0.0.1
          SING_BOX_MIXED_PORT=7890
          ENV
          sudo tee "$NODE_HOME/nodes/nodes.json" >/dev/null <<'JSON'
          {"version":3,"default":"n1","settings":{"strategy":"manual","route_mode":"global"},"subscriptions":[],"inbounds":[],
           "nodes":[
            {"id":"n1","name":"美国【优化|×3】","type":"vless","server":"us.example.com","server_port":443,"uuid":"11111111-2222-3333-4444-555555555555","tls":{"enabled":true,"server_name":"us.example.com"},"source":"import-uri"},
            {"id":"n2","name":"香港【ix|×4】","type":"shadowsocks","server":"hk.example.com","server_port":27644,"method":"aes-128-gcm","password":"pw2","source":"import-uri"},
            {"id":"n3","name":"日本【softbank】","type":"trojan","server":"jp.example.com","server_port":443,"password":"pw3","tls":{"enabled":true,"server_name":"jp.example.com"},"source":"import-uri"}
           ]}
          JSON
          sudo chmod 600 "$NODE_HOME/nodes/nodes.json"

          sbx_node() { sudo env SBX_HOME="$NODE_HOME" bash "$NODE_HOME/bin/sbx" "$@"; }
          helper() { sudo env SBX_HOME="$NODE_HOME" python3 "$NODE_HOME/lib/sbx_nodes.py" "$@"; }
          json_field() { sudo python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[sys.argv[2]])' "$NODE_HOME/nodes/nodes.json" "$1"; }
          py_nodes() { sudo python3 - "$NODE_HOME/nodes/nodes.json" "$@"; }

          # 列表用序号，内部 ID 默认不显示
          echo '--- 列表：显示序号、隐藏 ID ---'
          sbx_node node list > /tmp/sbx-node-list.txt
          sudo chmod 644 /tmp/sbx-node-list.txt
          cat /tmp/sbx-node-list.txt
          grep -F '序号' /tmp/sbx-node-list.txt
          grep -F '美国【优化|×3】' /tmp/sbx-node-list.txt
          grep -qE '^\* +1 +vless' /tmp/sbx-node-list.txt
          if grep -qF 'n1' /tmp/sbx-node-list.txt; then echo '默认列表不应显示内部 ID' >&2; exit 1; fi
          sbx_node node list --ids > /tmp/sbx-node-list-ids.txt
          sudo chmod 644 /tmp/sbx-node-list-ids.txt
          grep -F 'n2' /tmp/sbx-node-list-ids.txt

          # 序号解析到正确的节点，越界给明确报错
          echo '--- 序号解析与越界报错 ---'
          helper show 1 | grep -F '美国【优化|×3】'
          helper show 3 | grep -F '日本【softbank】'
          if helper show 9 > /tmp/sbx-node-err.txt 2>&1; then echo '越界序号不应成功' >&2; exit 1; fi
          grep -F '序号超出范围' /tmp/sbx-node-err.txt
          grep -F '1-3' /tmp/sbx-node-err.txt

          # 名称 / 内部 ID / 全数字 ID 的老用法必须继续可用
          echo '--- 名称 / ID / 全数字 ID 兼容 ---'
          helper show '香港【ix|×4】' | grep -F '香港【ix|×4】'
          helper show n2 | grep -F '香港【ix|×4】'
          py_nodes <<'PY'
          import json, sys
          p = sys.argv[1]
          d = json.load(open(p))
          d["nodes"].append({"id": "11111111", "name": "全数字ID", "type": "shadowsocks", "server": "num.example.com",
                             "server_port": 8388, "method": "aes-128-gcm", "password": "pw4", "source": "manual"})
          json.dump(d, open(p, "w"), ensure_ascii=False)
          PY
          helper show 11111111 | grep -F '全数字ID'
          helper show 4 | grep -F '全数字ID'

          # 用序号切换默认出口
          echo '--- 用序号切换默认出口 ---'
          helper default 2 >/dev/null
          test "$(json_field default)" = 'n2'
          sbx_node node list > /tmp/sbx-node-list2.txt
          sudo chmod 644 /tmp/sbx-node-list2.txt
