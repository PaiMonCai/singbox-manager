name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          bash -n install.sh
          bash -n bin/sbx
          bash -n lib/sbx_v3.sh
          bash -n lib/sbx_proxy.sh
          bash -n lib/sbx_bootstrap.sh
          bash -n lib/sbx_image.sh
          bash -n lib/sbx_inbound.sh

      - name: Python syntax
        run: python -m py_compile lib/sbx_nodes.py

      - name: Verify installer prefers raw source
        run: |
          grep -F 'SBX_SOURCE_BASE_URL' install.sh
          grep -F 'raw.githubusercontent.com' install.sh
          grep -F 'raw 源不可用，回退 GitHub archive' install.sh
          grep -F 'lib/sbx_inbound.sh' install.sh
          awk '/get_source\(\)/,/read_env_value\(\)/' install.sh | grep -F 'SOURCE_BASE_URL'
          awk '/get_source\(\)/,/read_env_value\(\)/' install.sh | grep -F 'ARCHIVE_URL'

      - name: Validate example JSON
        run: python -m json.tool config/config.example.json >/dev/null

      - name: Validate Compose
        run: |
          cp .env.example .env
          mkdir -p data backup nodes
          cp config/config.example.json config/config.json
          docker compose -f compose.yml config >/dev/null

      - name: Verify runtime loads only config.json
        run: |
          grep -F '      - -c' compose.yml
          grep -F '      - /etc/sing-box/config.json' compose.yml
          if grep -F '      - -C' compose.yml; then
            echo "compose must not load the entire config directory" >&2
            exit 1
          fi

      - name: Generate managed config for all supported node types
        env:
          SBX_HOME: ${{ github.workspace }}/.ci-home
        run: |
          mkdir -p "$SBX_HOME/nodes" "$SBX_HOME/config"
          cat > "$SBX_HOME/nodes/nodes.json" <<'JSON'
          {
            "version": 1,
            "default": "11111111",
            "nodes": [
              {
                "id": "11111111",
                "name": "ss-test",
                "type": "shadowsocks",
                "server": "127.0.0.1",
                "server_port": 8388,
                "method": "aes-256-gcm",
                "password": "test-password"
              },
              {
                "id": "22222222",
                "name": "vless-test",
                "type": "vless",
                "server": "example.com",
                "server_port": 443,
                "uuid": "bf000d23-0752-40b4-affe-68f7707a9661",
                "tls": {
                  "enabled": true,
                  "server_name": "example.com",
                  "insecure": false
                }
              },
              {
                "id": "33333333",
                "name": "trojan-test",
                "type": "trojan",
                "server": "example.com",
                "server_port": 443,
                "password": "test-password",
                "tls": {
                  "enabled": true,
                  "server_name": "example.com",
                  "insecure": false
                }
              },
              {
                "id": "44444444",
                "name": "hy2-test",
                "type": "hysteria2",
                "server": "example.com",
                "server_port": 443,
                "password": "test-password",
                "tls": {
                  "enabled": true,
                  "server_name": "example.com",
                  "insecure": false
                }
              },
              {
                "id": "55555555",
                "name": "socks-test",
                "type": "socks",
                "server": "127.0.0.1",
                "server_port": 1080,
                "version": "5",
                "username": "user",
                "password": "pass"
              }
            ]
          }
          JSON
          python lib/sbx_nodes.py validate
          python lib/sbx_nodes.py render
          python -m json.tool "$SBX_HOME/config/config.json" >/dev/null

      - name: Exercise imports and automatic routing
        env:
          SBX_HOME: ${{ github.workspace }}/.ci-home
        run: |
          python lib/sbx_nodes.py import-uri 'ss://YWVzLTI1Ni1nY206cGFzcw==@example.com:8388#SS-import'
          printf '%s\n' 'trojan://secret@example.com:443?security=tls&sni=example.com#Trojan-import' > /tmp/sbx-sub.txt
          python lib/sbx_nodes.py import-file /tmp/sbx-sub.txt --source ci-subscription
          python lib/sbx_nodes.py strategy auto
          python lib/sbx_nodes.py route-mode cn-direct-full
          python lib/sbx_nodes.py validate
          python lib/sbx_nodes.py render
          python -m json.tool "$SBX_HOME/config/config.json" >/dev/null

      - name: Exercise multi-inbound routing
        env:
          SBX_HOME: ${{ github.workspace }}/.ci-home
        run: |
          python lib/sbx_nodes.py inbound-add \
            --name "HK-entry" \
            --listen 127.0.0.1 \
            --port 7891 \
            --target node:11111111

          python lib/sbx_nodes.py inbound-add \
            --name "Auto-entry" \
            --listen 127.0.0.1 \
            --port 7892 \
            --target auto

          python lib/sbx_nodes.py inbound-list
          python lib/sbx_nodes.py validate
          python lib/sbx_nodes.py render

          python - <<'PY'
          import json, os
          from pathlib import Path
          home = Path(os.environ["SBX_HOME"])
          cfg = json.loads((home / "config/config.json").read_text())
          custom = [x for x in cfg["inbounds"] if x["tag"].startswith("inbound-")]
          assert len(custom) == 2, custom
          rules = cfg["route"]["rules"]
          assert rules[0]["inbound"][0].startswith("inbound-")
          assert rules[0]["outbound"] == "node-11111111"
          assert rules[1]["outbound"] == "auto"
          ports = (home / "compose.inbounds.yml").read_text()
          assert "127.0.0.1:7891:7891/tcp" in ports
          assert "127.0.0.1:7892:7892/tcp" in ports
          PY

          docker compose \
            --env-file .env.example \
            -f compose.yml \
            -f "$SBX_HOME/compose.inbounds.yml" \
            config >/tmp/sbx-compose-merged.yml

          grep -F 'published: "7891"' /tmp/sbx-compose-merged.yml
          grep -F 'published: "7892"' /tmp/sbx-compose-merged.yml

      - name: Exercise bootstrap image configuration
        run: |
          cp .env.example /tmp/sbx-bootstrap.env
          info() { :; }
          warn() { :; }
          die() { printf 'ERROR: %s\n' "$*" >&2; return 1; }
          ask() { printf '%s\n' "${2:-}"; }
          confirm() { return 0; }
          source lib/sbx_bootstrap.sh
          test "$(bootstrap_image_repo /tmp/sbx-bootstrap.env)" = "ghcr.io/sagernet/sing-box"
          SING_BOX_IMAGE=registry.example.com/sagernet/sing-box docker compose --env-file .env.example -f compose.yml config | grep -F 'registry.example.com/sagernet/sing-box:v1.14.2'

      - name: Verify runtime image guard never pulls implicitly
        run: |
          export HOME_DIR="${{ github.workspace }}/.ci-image-home"
          export ENV="$HOME_DIR/.env"
          mkdir -p "$HOME_DIR/config" "$HOME_DIR/data"
          cp .env.example "$ENV"
          : > "$HOME_DIR/config/config.json"
          LOG=/tmp/sbx-image-docker.log
          : > "$LOG"
          envval() { grep -E "^$1=" "$ENV" | tail -n1 | cut -d= -f2- || printf '%s' "$2"; }
          info() { :; }
          warn() { :; }
          die() { printf 'ERROR: %s\n' "$*" >&2; return 1; }
          dc() { printf 'compose %s\n' "$*" >> "$LOG"; return 0; }
          status() { :; }
          running() { return 0; }
          http_test() { return 0; }
          python3() { command python3 "$@"; }
          bootstrap_ensure_image() {
            test "$3" = runtime
            printf 'bootstrap %s %s %s\n' "$1" "$2" "$3" >> "$LOG"
            return 1
          }
          docker() {
            printf 'docker %s\n' "$*" >> "$LOG"
            if [[ "$1" == "image" && "$2" == "inspect" ]]; then
              return 1
            fi
            return 0
          }
          source lib/sbx_image.sh
          if image_require; then
            echo "image_require unexpectedly succeeded" >&2
            exit 1
          fi
          ! grep -E 'docker (pull|compose .*pull)' "$LOG"
          grep -F 'bootstrap v1.14.2' "$LOG"

          : > "$LOG"
          docker() {
            printf 'docker %s\n' "$*" >> "$LOG"
            if [[ "$1" == "image" && "$2" == "inspect" ]]; then
              return 0
            fi
            return 0
          }
          check
          grep -F -- '--pull=never' "$LOG"
          grep -F -- '--pull never' lib/sbx_image.sh

      - name: Exercise host proxy config generation
        run: |
          export HOME_DIR="${{ github.workspace }}/.ci-home"
          export ENV="${{ github.workspace }}/.ci-proxy.env"
          export SBX_PROXY_STATE_DIR="${{ github.workspace }}/.ci-proxy-state"
          export SBX_DOCKER_DROPIN_DIR="${{ github.workspace }}/.ci-systemd"
          export SBX_DOCKER_PROXY_FILE="$SBX_DOCKER_DROPIN_DIR/99-singbox-manager-proxy.conf"
          export SBX_APT_PROXY_FILE="${{ github.workspace }}/.ci-apt/99singbox-manager-proxy"
          export SBX_GIT_PROXY_FILE="${{ github.workspace }}/.ci-git/git-proxy.conf"
          export SBX_PROXY_NO_APPLY=1
          mkdir -p "$HOME_DIR" "$SBX_PROXY_STATE_DIR"
          cp .env.example "$ENV"
          envval() { grep -E "^$1=" "$ENV" | tail -n1 | cut -d= -f2- || printf '%s' "$2"; }
          running() { return 0; }
          dc() { return 0; }
          info() { :; }
          warn() { :; }
          die() { printf 'ERROR: %s\n' "$*" >&2; return 1; }
          source lib/sbx_proxy.sh
          proxy_apt_on
          proxy_docker_on
          grep -F 'Acquire::https::Proxy "http://127.0.0.1:7890";' "$SBX_APT_PROXY_FILE"
          grep -F 'Environment="HTTPS_PROXY=http://127.0.0.1:7890"' "$SBX_DOCKER_PROXY_FILE"
          proxy_env | grep -F "export HTTPS_PROXY='http://127.0.0.1:7890'"

      - name: Validate generated config with sing-box
        env:
          SBX_HOME: ${{ github.workspace }}/.ci-home
        run: |
          docker run --rm \
            -v "$SBX_HOME/config:/etc/sing-box:ro" \
            ghcr.io/sagernet/sing-box:v1.14.2 \
            check -c /etc/sing-box/config.json -D /tmp/sing-box
