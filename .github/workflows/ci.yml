      - name: Re-run installer reuses the existing config
        run: |
          rm -rf /tmp/sbx-reinstall /tmp/sbx-reinstall-bin
          mkdir -p /tmp/sbx-reinstall/nodes /tmp/sbx-reinstall-bin
          # 预置一份“已有安装”：.env + 一个节点
          printf 'SING_BOX_IMAGE=localhost.invalid/sing-box\nSING_BOX_VERSION=v1.14.2\nSING_BOX_CONTAINER_NAME=sing-box\nSING_BOX_BIND_ADDR=127.0.0.1\nSING_BOX_MIXED_PORT=7890\nSING_BOX_DOCKER_NETWORK=singbox-proxy\n' > /tmp/sbx-reinstall/.env
          printf '{"version":3,"default":"n1","settings":{},"subscriptions":[],"inbounds":[],"nodes":[{"id":"n1","name":"N1","type":"vless","server":"e.example.com","server_port":443,"uuid":"11111111-2222-3333-4444-555555555555"}]}' > /tmp/sbx-reinstall/nodes/nodes.json
          ENVS="SBX_BOOTSTRAP_PULL_TIMEOUT=3 SBX_INSTALL_DIR=/tmp/sbx-reinstall SBX_BIN_LINK=/tmp/sbx-reinstall-bin/sbx SBX_INSTALLER_LINK=/tmp/sbx-reinstall-bin/sbx-install"
          # stdin 喂入非法值：沿用现有配置时根本不读 stdin（应当成功）；
          # 一旦真的去询问配置，读取到非法值就会失败。
          # 不用 `yes | head`：在 pipefail 的 shell 下会因 SIGPIPE 返回 141
          for _ in $(seq 1 30); do echo 70000; done > /tmp/sbx-bad-stdin
          sudo env $ENVS bash install.sh < /tmp/sbx-bad-stdin > /tmp/sbx-reuse.log 2>&1 || {
            echo "二次运行失败（应沿用现有配置）" >&2; cat /tmp/sbx-reuse.log; exit 1; }
          grep -F '检测到已有安装，沿用现有配置' /tmp/sbx-reuse.log
          if sudo env $ENVS SBX_RECONFIGURE=1 bash install.sh < /tmp/sbx-bad-stdin > /tmp/sbx-reconf.log 2>&1; then
            echo "SBX_RECONFIGURE=1 时应重新询问（并因非法输入失败）" >&2
            cat /tmp/sbx-reconf.log; exit 1
          fi
          if grep -F '检测到已有安装，沿用现有配置' /tmp/sbx-reconf.log; then
            echo "SBX_RECONFIGURE=1 时不应走沿用分支" >&2; exit 1
          fi

      - name: Exercise manager version comparison
        run: |
          export HOME_DIR="${{ github.workspace }}/.ci-version-home"
          mkdir -p "$HOME_DIR"
          info() { :; }
          warn() { printf 'WARN %s\n' "$*" >&2; }
          die() { printf 'ERROR: %s\n' "$*" >&2; return 1; }
          source lib/sbx_update.sh

          check_cmp() { # local remote expected
            local rc=0
            manager_version_cmp "$1" "$2" || rc=$?
            if [ "$rc" != "$3" ]; then
              echo "manager_version_cmp '$1' '$2' = $rc，期望 $3" >&2
              exit 1
            fi
          }
          # 0=远端更新 1=相同 2=远端更旧 3=无法解析
          check_cmp 0.11.0 0.11.1 0
          check_cmp 0.11.1 0.11.1 1
          check_cmp 0.11.1 0.11.0 2
          check_cmp 0.10.9 0.11.0 0
          check_cmp 0.11.1 0.11 2
          check_cmp v0.11.0 0.11.1 0
          check_cmp 0.11.1-rc1 0.11.1 0
          check_cmp 0.11.01 0.11.1 0
          check_cmp latest 0.11.1 3
          check_cmp '' 0.11.1 3

          mkdir -p "${{ github.workspace }}/.ci-update-src"
          printf '0.11.2\n' > "${{ github.workspace }}/.ci-update-src/VERSION"
          if ! curl -fsS --max-time 5 "file://${{ github.workspace }}/.ci-update-src/VERSION" >/dev/null 2>&1; then
            echo "curl 不支持 file://，跳过 manager_check 三态检查"
          else
            export SBX_UPDATE_BASE_URL="file://${{ github.workspace }}/.ci-update-src"
            source lib/sbx_update.sh
            printf '0.11.1\n' > "$HOME_DIR/VERSION"
            manager_check | tee /tmp/sbx-ver-newer.out
            grep -F '状态: 有可用更新' /tmp/sbx-ver-newer.out
            printf '0.11.2\n' > "$HOME_DIR/VERSION"
            manager_check | tee /tmp/sbx-ver-same.out
            grep -F '状态: 已是最新版本' /tmp/sbx-ver-same.out
            printf '0.12.0\n' > "$HOME_DIR/VERSION"
            manager_check | tee /tmp/sbx-ver-ahead.out
            grep -F '本地版本更新' /tmp/sbx-ver-ahead.out
          fi

      - name: Exercise auto-update timer generation
