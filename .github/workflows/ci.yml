          cat > /tmp/sbx-fake-bin/curl <<'EOF'
          #!/usr/bin/env bash
          set -eu
          out=""
          proxy=0
          while [ "$#" -gt 0 ]; do
            case "$1" in
              --proxy) proxy=1; shift 2 ;;
              -o) out="$2"; shift 2 ;;
              *) shift ;;
            esac
          done
          if [ "$proxy" -eq 0 ]; then
            exit 28
          fi
          printf '#!/usr/bin/env bash\nexit 0\n' > "$out"
